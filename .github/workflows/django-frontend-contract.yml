name: Django frontend checks and cPanel handoff

'on':
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "shared/build.js"
      - "shared/src/css/**"
      - "shared/src/design/tokens.json"
      - "deploy/frontend-manifest.json"
      - ".github/workflows/django-frontend-contract.yml"
  pull_request:
    branches:
      - main
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "shared/build.js"
      - "shared/src/css/**"
      - "shared/src/design/tokens.json"
      - "deploy/frontend-manifest.json"
      - ".github/workflows/django-frontend-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate Django frontend and build cPanel handoff
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: |
          set -euo pipefail
          node --check django/static/js/tatami.js
          node --check django/static/js/module-pages.js
          node --check django/static/js/home-restored.js

      - name: Verify shared design system output
        run: |
          set -euo pipefail
          node shared/build.js
          git diff --exit-code -- django/static/css/tatami.css

      - name: Check frontend patch contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base = Path("django/templates/base.html").read_text(encoding="utf-8")
          login = Path("django/templates/accounts/login.html").read_text(encoding="utf-8")
          otp = Path("django/templates/accounts/otp_verify.html").read_text(encoding="utf-8")
          profile = Path("django/templates/accounts/complete_profile.html").read_text(encoding="utf-8")
          gem_history = Path("django/templates/gems/history.html").read_text(encoding="utf-8")
          gem_badge = Path("django/templates/components/gem_badge.html").read_text(encoding="utf-8")
          order_templates = [
              Path("django/templates/orders") / name
              for name in ("address.html", "review.html", "payment_result.html", "order_list.html", "order_detail.html")
          ]
          order_sources = [path.read_text(encoding="utf-8") for path in order_templates]
          shared_css = Path("django/static/css/tatami.css").read_text(encoding="utf-8")
          frontend_manifest = json.loads(Path("deploy/frontend-manifest.json").read_text(encoding="utf-8"))
          admin = Path("django/templates/admin/base_site.html").read_text(encoding="utf-8")
          episode = Path("django/templates/club/coach/episode_form.html").read_text(encoding="utf-8")
          js = Path("django/static/js/tatami.js").read_text(encoding="utf-8")
          admin_css = Path("django/static/css/tatami-admin.css").read_text(encoding="utf-8")
          module_css = Path("django/static/css/module-pages.css").read_text(encoding="utf-8")
          backend_css = Path("django/static/css/backend-templates.css").read_text(encoding="utf-8")
          manifest = json.loads(Path("deploy/frontend-manifest.json").read_text(encoding="utf-8"))

          assert 'data-auth-form="login"' in login
          assert "{% include 'includes/form_fields.html' %}" in login
          assert "{% url 'phone_auth:verify_otp' %}" in otp
          assert "{% url 'phone_auth:send_otp' %}" in otp
          assert "{% include 'includes/form_fields.html' %}" in profile
          assert "{% url 'gems:history' %}" in gem_badge
          assert "tp-gem-table" in gem_history and "tp-gem-positive" in gem_history
          assert all("page-main" not in source and "button-dark" not in source for source in order_sources)
          assert all("{% csrf_token %}" in source for source in order_sources if "method=\"post\"" in source)
          assert ".tp-auth-layout{" in shared_css and ".tp-auth-aside{" in shared_css
          assert ".tp-gem-table{" in shared_css
          assert "accounts/login.html" not in next(item for item in frontend_manifest["mappings"] if item["destination"] == "templates").get("exclude", [])
          static_mapping = next(item for item in frontend_manifest["mappings"] if item["destination"] == "static")
          assert "css/tatami.css" not in static_mapping.get("exclude", [])
          assert '<header>' in base
          assert '<a class="logo"' in base
          assert '<nav id="nv"' in base
          assert 'id="hcart"' in base
          assert 'id="hgem"' in base
          assert 'id="mnb"' in base and 'id="mnd"' in base and 'id="mnx"' in base
          assert 'css/styles.css' not in base, "Legacy backend theme must not be loaded by the Django shell"
          assert 'class="site-header"' not in base and 'class="site-nav"' not in base and 'class="wordmark"' not in base
          assert 'class="site-footer"' not in base
          assert 'class="ib tp-gem-header gem-chip" id="hgem"' in base
          assert 'class="tp-drawer-n"' in base
          assert 'css/tatami.css' in base, "Shared Tatami Plus design system must be loaded"
          assert "new_coach_leads_count" in admin
          assert "admin:accounts_signuplead_changelist" in admin
          assert "data-video-upload-form" in episode
          assert "tp-otp-resend-until:" in js
          assert "request.upload.addEventListener('progress'" in js
          assert "uploadRequest.abort()" in js
          assert "X-CSRFToken" in js
          assert ".tp-video-upload-progress" in module_css
          assert ".tp-admin-lead-notice" in admin_css
          assert ".site-header" not in backend_css and ".site-nav" not in backend_css
          assert ".wordmark" not in backend_css and ".site-footer" not in backend_css
          assert ".page-main" not in backend_css and ".button-dark" not in backend_css
          assert ".product-grid" not in backend_css and ".cart-row" not in backend_css
          assert len(backend_css) < 1000
          assert "#app" in backend_css and ".tp-msgs" in backend_css
          account = Path("django/templates/pages/account.html").read_text(encoding="utf-8")
          assert "{% url 'orders:list' %}" in account
          assert "{% url 'gems:history' %}" in account
          assert "{% url 'club:course_list' %}" in account
          for episode_template in ("django/templates/club/course_detail.html", "django/templates/club/episode_play.html"):
              episode_source = Path(episode_template).read_text(encoding="utf-8")
              assert 'class="lesson-done"' not in episode_source

          print("FRONTEND_PATCH_CONTRACT_OK")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the pinned backend contract revision
        run: |
          set -euo pipefail
          git clone https://github.com/Radinsharifi/Tatami-demo.git backend
          git -C backend checkout --detach e2ffeba0a42ecc3ec172b89d66794f9cd628d977

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install proposed frontend templates and static files into isolated backend checkout
        run: |
          set -euo pipefail
          mkdir -p backend/templates backend/static
          cp -a django/templates/. backend/templates/
          cp -a django/static/. backend/static/

      - name: Validate Django settings
        working-directory: backend
        run: python manage.py check

      - name: Compile templates and resolve required static assets
        working-directory: backend
        run: |
          python manage.py shell -c "from django.template.loader import get_template; from django.contrib.staticfiles.finders import find; names=('base.html','admin/base_site.html','pages/home.html','pages/account.html','store/product_list.html','store/product_detail.html','store/cart_detail.html','coaches/directory.html','coaches/profile_detail.html','club/course_list.html','club/course_detail.html','club/coach/episode_form.html','gems/history.html','accounts/login.html','accounts/otp_verify.html','accounts/complete_profile.html','orders/address.html','orders/review.html','orders/payment_result.html','orders/order_list.html','orders/order_detail.html','includes/form_fields.html'); [get_template(name) for name in names]; assets=('css/tatami.css','css/tatami-admin.css','css/backend-templates.css','css/module-pages.css','css/home-restored.css','js/tatami.js','js/module-pages.js','js/home-restored.js'); assert all(find(name) for name in assets); print('DJANGO_TEMPLATE_AND_STATIC_CHECK_OK')"

      - name: Run backend tests with proposed frontend
        working-directory: backend
        run: python manage.py test accounts.tests.AuthenticationFlowTests accounts.tests.CoachSignupLeadTests accounts.tests.AccountPageTests gems.tests.GemPageTests orders.tests.CheckoutFlowTests --verbosity 1

      - name: Build separate templates and static cPanel packages
        run: |
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path("deploy/frontend-manifest.json").read_text(encoding="utf-8"))
          packages = {"templates": [], "static": []}
          roots = {"templates": Path("package-templates"), "static": Path("package-static")}

          for root in roots.values():
              if root.exists():
                  import shutil
                  shutil.rmtree(root)
              root.mkdir(parents=True)

          for mapping in manifest["mappings"]:
              kind = Path(mapping["destination"]).name
              if kind not in packages:
                  raise SystemExit(f"Unsupported deployment destination: {mapping['destination']}")
              source_root = Path(mapping["source"])
              extensions = {suffix.lower() for suffix in mapping["extensions"]}
              excludes = mapping.get("exclude", [])

              for source in sorted(source_root.rglob("*")):
                  if not source.is_file():
                      continue
                  if source.is_symlink():
                      raise SystemExit(f"Refusing symlink: {source}")
                  relative = source.relative_to(source_root).as_posix()
                  if any(relative == item or relative.startswith(item.rstrip("/") + "/") for item in excludes):
                      continue
                  if source.suffix.lower() not in extensions:
                      continue

                  target = roots[kind] / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read_bytes())
                  data = target.read_bytes()
                  packages[kind].append({
                      "path": relative,
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })

          for kind, entries in packages.items():
              if not entries:
                  raise SystemExit(f"Manifest selected zero {kind} files")
              entries.sort(key=lambda item: item["path"])
              archive = Path(f"{kind}.zip")
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as bundle:
                  for source in sorted(roots[kind].rglob("*")):
                      if source.is_file():
                          bundle.write(source, source.relative_to(roots[kind]).as_posix())
              with zipfile.ZipFile(archive) as bundle:
                  bad = bundle.testzip()
                  if bad:
                      raise SystemExit(f"{kind}.zip integrity failure: {bad}")
                  archived = set(bundle.namelist())
              expected = {item["path"] for item in entries}
              if archived != expected:
                  raise SystemExit(f"{kind}.zip file list mismatch")
              print(
                  f"{kind.upper()}_PACKAGE_OK | files={len(entries)} | "
                  f"bytes={archive.stat().st_size} | source_commit={__import__('os').environ.get('GITHUB_SHA')}"
              )
          PY

      - name: Upload templates package
        uses: actions/upload-artifact@v4
        with:
          name: tatami-templates
          path: templates.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload static package
        uses: actions/upload-artifact@v4
        with:
          name: tatami-static
          path: static.zip
          if-no-files-found: error
          retention-days: 14

