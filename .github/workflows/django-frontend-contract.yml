name: Validate Django frontend against backend

on:
  pull_request:
    branches: [main]
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "shared/src/css/**"
      - "shared/src/design/tokens.json"
      - "shared/public/fonts/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/django-frontend-contract.yml"
  push:
    branches: [main]
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "shared/src/css/**"
      - "shared/src/design/tokens.json"
      - "shared/public/fonts/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/django-frontend-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  django-template-contract:
    name: Render frontend templates with the real Django backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate Django CSS from the shared design system
        run: |
          set -euo pipefail
          node shared/build.js
          test -s django/static/css/tatami.css
          grep -q 'grid,.pg' django/static/css/tatami.css

      - name: Check Django browser JavaScript syntax
        run: node --check django/static/js/tatami.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the backend contract revision (read-only)
        run: |
          set -euo pipefail
          git clone https://github.com/Radinsharifi/Tatami-demo.git backend
          git -C backend checkout --detach c88d977949897017e848c3ba23b3ec1bcc0a3ebb

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install the frontend templates and static assets into the isolated backend checkout
        run: |
          set -euo pipefail
          mkdir -p backend/templates backend/static
          cp -a django/templates/. backend/templates/
          cp -a django/static/. backend/static/

      - name: Validate Django settings and template URL reversals
        working-directory: backend
        run: python manage.py check

      - name: Run backend tests with the proposed frontend templates
        working-directory: backend
        run: python manage.py test --verbosity 2

      - name: Commit regenerated Django CSS to the pull request branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add django/static/css/tatami.css
          if git diff --cached --quiet; then
            echo "Generated Django CSS is already synchronized."
            exit 0
          fi
          git commit -m "Build Django CSS from shared design tokens"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Verify generated CSS when the workflow cannot write it back
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
        run: git diff --exit-code -- django/static/css/tatami.css

      - name: Package the complete Django frontend handoff
        run: |
          set -euo pipefail
          mkdir -p handoff/templates handoff/static
          cp -a django/templates/. handoff/templates/
          cp -a django/static/. handoff/static/
          (cd handoff && zip -qr "$GITHUB_WORKSPACE/tatami-django-frontend-handoff.zip" templates static)

      - name: Upload backend handoff package
        uses: actions/upload-artifact@v4
        with:
          name: tatami-django-frontend-handoff
          path: tatami-django-frontend-handoff.zip
          if-no-files-found: error
          retention-days: 14
