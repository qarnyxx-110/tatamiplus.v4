name: Validate Django frontend against backend

on:
  pull_request:
    branches: [main]
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "shared/src/js/shared/django-route-bridge.js"
      - "shared/src/css/**"
      - "shared/src/design/tokens.json"
      - "shared/public/fonts/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/django-frontend-contract.yml"
  push:
    branches: [main]
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "shared/src/js/shared/django-route-bridge.js"
      - "shared/src/css/**"
      - "shared/src/design/tokens.json"
      - "shared/public/fonts/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/django-frontend-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  django-template-contract:
    name: Render frontend templates with the real Django backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate Django CSS from the shared design system
        run: |
          set -euo pipefail
          node shared/build.js
          test -s django/static/css/tatami.css
          grep -q 'grid,.pg' django/static/css/tatami.css

      - name: Check Django browser JavaScript syntax
        run: node --check django/static/js/tatami.js

      - name: Verify Django Admin brand color follows the design system
        run: grep -q -- '--tp-admin-brand: #2F62D6;' django/static/css/tatami-admin.css

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the backend contract revision (read-only)
        run: |
          set -euo pipefail
          git clone https://github.com/Radinsharifi/Tatami-demo.git backend
          git -C backend checkout --detach e2ffeba0a42ecc3ec172b89d66794f9cd628d977

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install the frontend templates and static assets into the isolated backend checkout
        run: |
          set -euo pipefail
          mkdir -p backend/templates backend/static
          cp -a django/templates/. backend/templates/
          cp -a django/static/. backend/static/

      - name: Validate Django settings and template URL reversals
        working-directory: backend
        run: python manage.py check

      - name: Verify real Django templates, route names and static assets
        working-directory: backend
        run: |
          python manage.py shell -c "from django.template.loader import get_template; from django.urls import reverse; from django.contrib.staticfiles.finders import find; templates=('base.html','pages/home.html','pages/account.html','store/product_list.html','store/product_detail.html','store/cart_detail.html','coaches/directory.html','coaches/profile_detail.html','club/course_list.html','club/course_detail.html','gems/history.html','accounts/login.html','includes/form_fields.html','admin/base_site.html'); [get_template(name) for name in templates]; routes=('home','store:product_list','store:product_detail','store:cart','coaches:directory','coaches:profile_detail','club:course_list','club:course_detail','gems:history','phone_auth:login','orders:address','orders:review','orders:list','account'); [reverse(name, kwargs={'slug':'contract-probe'} if name in ('store:product_detail','club:course_detail') else {'profile_id':1} if name == 'coaches:profile_detail' else None) for name in routes]; assert find('css/tatami-admin.css'); assert find('css/backend-templates.css'); assert find('css/module-pages.css'); assert find('js/tatami.js'); print('DJANGO_FRONTEND_CONTRACT_OK')"

      - name: Run backend tests with the proposed frontend templates
        working-directory: backend
        run: python manage.py test --verbosity 2

      - name: Commit regenerated Django CSS to the pull request branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add django/static/css/tatami.css
          if git diff --cached --quiet; then
            echo "Generated Django CSS is already synchronized."
            exit 0
          fi
          git commit -m "Build Django CSS from shared design tokens"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Verify generated CSS when the workflow cannot write it back
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
        run: git diff --exit-code -- django/static/css/tatami.css

      - name: Package only manifest-approved Django frontend files
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          manifest_path = Path("deploy/frontend-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          handoff = Path("handoff")
          if handoff.exists():
              shutil.rmtree(handoff)
          handoff.mkdir()

          selected = []
          for mapping in manifest["mappings"]:
              source_root = Path(mapping["source"])
              destination_root = Path(mapping["destination"])
              extensions = {suffix.lower() for suffix in mapping["extensions"]}
              excludes = mapping.get("exclude", [])

              for source in sorted(source_root.rglob("*")):
                  if not source.is_file():
                      continue
                  if source.is_symlink():
                      raise SystemExit(f"Refusing symlink: {source}")
                  relative = source.relative_to(source_root).as_posix()
                  if any(relative == item or relative.startswith(item.rstrip("/") + "/") for item in excludes):
                      continue
                  if source.suffix.lower() not in extensions:
                      continue

                  destination = destination_root / relative
                  target = handoff / destination
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  data = target.read_bytes()
                  selected.append({
                      "path": destination.as_posix(),
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })

          if not selected:
              raise SystemExit("Manifest selected zero files")
          selected.sort(key=lambda item: item["path"])
          (handoff / "DEPLOYMENT.json").write_text(
              json.dumps({
                  "schema_version": 1,
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "source_commit": os.environ.get("GITHUB_SHA"),
                  "file_count": len(selected),
                  "files": selected,
              }, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8",
          )
          (handoff / "deploy").mkdir()
          shutil.copy2(manifest_path, handoff / "deploy/frontend-manifest.json")

          archive = Path(os.environ["GITHUB_WORKSPACE"]) / "tatami-django-frontend-handoff.zip"
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as bundle:
              for item in sorted(handoff.rglob("*")):
                  if item.is_file():
                      bundle.write(item, item.relative_to(handoff).as_posix())
          print(f"DJANGO_FRONTEND_PACKAGE_OK | files={len(selected)} | commit={os.environ.get('GITHUB_SHA')}")
          PY

      - name: Upload backend handoff package
        uses: actions/upload-artifact@v4
        with:
          name: tatami-django-frontend-handoff
          path: tatami-django-frontend-handoff.zip
          if-no-files-found: error
          retention-days: 14
