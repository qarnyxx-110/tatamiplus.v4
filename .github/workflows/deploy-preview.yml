name: Build and deploy Tatami Plus preview to cPanel

on:
  push:
    branches:
      - main
    paths:
      - "shared/src/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/deploy-preview.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shared/src/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build static preview
        working-directory: shared
        run: npm run build

      - name: Validate generated preview
        working-directory: shared
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/preview/index.html
          test -d dist/preview/assets
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const html = fs.readFileSync("dist/preview/index.html", "utf8");
          if (!html.includes('<main id="app"></main>')) {
            throw new Error("Preview app mount point is missing.");
          }
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (scripts.length === 0) {
            throw new Error("No inline application script was generated.");
          }
          fs.writeFileSync("/tmp/tatami-preview-inline.js", scripts.map(match => match[1]).join("\n"));
          JSON.parse(fs.readFileSync("dist/preview/assets/images/manifest.json", "utf8"));
          NODE
          node --check /tmp/tatami-preview-inline.js

      - name: Skip upload until cPanel secrets are configured
        if: ${{ github.event_name != 'pull_request' && (env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == '') }}
        run: echo "::notice::Build passed. Add FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD repository secrets to enable cPanel publishing."

      - name: Deploy preview to the restricted cPanel FTP directory
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: ./shared/dist/preview/
          server-dir: ./
          dangerous-clean-slate: false
          security: strict
          timeout: 60000
