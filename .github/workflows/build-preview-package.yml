name: Build manual cPanel Preview package

on:
  push:
    branches:
      - "feat/preview-course-catalog"
      - "feat/tatami-frontend-fixes-20261117"
    paths:
      - "shared/src/**"
      - "shared/public/assets/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/build-preview-package.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shared/src/**"
      - "shared/public/assets/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/build-preview-package.yml"

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Preview
        working-directory: shared
        run: node build.js

      - name: Validate generated Preview and JavaScript syntax
        working-directory: shared
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/preview/index.html
          test -d dist/preview/assets
          test -s dist/preview/assets/images/manifest.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const html = fs.readFileSync("dist/preview/index.html", "utf8");
          const required = [
            '<main id="app"></main>',
            "دوره‌های آموزشی",
            "پخش ویدئو در پیش‌نمایش فعال نیست",
            "ثبت‌نام در دوره",
            "جم‌های من",
            "تاریخچه تراکنش‌ها",
            "موجودی واقعی هنوز به این نسخه متصل نشده است.",
            "جستجوی باشگاه‌ها",
            "نزدیک من",
            "نقشهٔ نشان",
            "اطلاعات فعلی: نمونه"
          ];
          for (const item of required) {
            if (!html.includes(item)) throw new Error("Missing Preview content: " + item);
          }
          const authRouteMarkers = ["/auth/login/", "location.replace(target)", "'www.tatamiplus.ir'"];
          for (const marker of authRouteMarkers) {
            if (!html.includes(marker)) throw new Error("Missing live Django route bridge marker: " + marker);
          }
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error("No inline application script was generated");
          fs.writeFileSync("/tmp/tatami-preview-inline.js", scripts.map(x => x[1]).join("\n"));
          JSON.parse(fs.readFileSync("dist/preview/assets/images/manifest.json", "utf8"));
          NODE
          node --check /tmp/tatami-preview-inline.js
          node --check public/assets/neshan-config.js
          test -s dist/preview/assets/neshan-config.js

      - name: Create cPanel upload ZIP
        working-directory: shared
        run: |
          set -euo pipefail
          cd dist/preview
          zip -qr "$GITHUB_WORKSPACE/tatami-preview-cpanel.zip" .

      - name: Upload manual cPanel package
        uses: actions/upload-artifact@v4
        with:
          name: tatami-preview-cpanel
          path: tatami-preview-cpanel.zip
          if-no-files-found: error
          retention-days: 7

      - name: Package manifest-approved Django frontend files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          manifest_path = Path("deploy/frontend-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          handoff = Path("django-handoff")
          if handoff.exists():
              shutil.rmtree(handoff)
          handoff.mkdir()

          selected = []
          for mapping in manifest["mappings"]:
              source_root = Path(mapping["source"])
              destination_root = Path(mapping["destination"])
              extensions = {suffix.lower() for suffix in mapping["extensions"]}
              excludes = mapping.get("exclude", [])

              for source in sorted(source_root.rglob("*")):
                  if not source.is_file():
                      continue
                  if source.is_symlink():
                      raise SystemExit(f"Refusing symlink: {source}")
                  relative = source.relative_to(source_root).as_posix()
                  if any(
                      relative == item or relative.startswith(item.rstrip("/") + "/")
                      for item in excludes
                  ):
                      continue
                  if source.suffix.lower() not in extensions:
                      continue

                  destination = destination_root / relative
                  target = handoff / destination
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  data = target.read_bytes()
                  selected.append({
                      "path": destination.as_posix(),
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })

          if len(selected) != 41:
              raise SystemExit(f"Expected 41 manifest-approved files, found {len(selected)}")

          selected.sort(key=lambda item: item["path"])
          metadata = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "file_count": len(selected),
              "files": selected,
          }
          (handoff / "DEPLOYMENT.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8",
          )
          (handoff / "deploy").mkdir()
          shutil.copy2(manifest_path, handoff / "deploy/frontend-manifest.json")

          archive = Path("tatami-django-frontend-handoff.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as bundle:
              for item in sorted(handoff.rglob("*")):
                  if item.is_file():
                      bundle.write(item, item.relative_to(handoff).as_posix())

          with zipfile.ZipFile(archive) as bundle:
              bad = bundle.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failure: {bad}")
          print(f"DJANGO_FRONTEND_PACKAGE_OK | files={len(selected)} | commit={os.environ['GITHUB_SHA']}")
          PY

      - name: Upload Django frontend handoff package
        uses: actions/upload-artifact@v4
        with:
          name: tatami-django-frontend-handoff
          path: tatami-django-frontend-handoff.zip
          if-no-files-found: error
          retention-days: 14
