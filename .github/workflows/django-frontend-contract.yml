name: Django frontend checks and cPanel handoff

'on':
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "deploy/frontend-manifest.json"
      - ".github/workflows/django-frontend-contract.yml"
  pull_request:
    branches:
      - main
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "deploy/frontend-manifest.json"
      - ".github/workflows/django-frontend-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate Django frontend and build cPanel handoff
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: |
          set -euo pipefail
          node --check django/static/js/tatami.js
          node --check django/static/js/module-pages.js
          node --check django/static/js/home-restored.js

      - name: Check frontend patch contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base = Path("django/templates/base.html").read_text(encoding="utf-8")
          admin = Path("django/templates/admin/base_site.html").read_text(encoding="utf-8")
          episode = Path("django/templates/club/coach/episode_form.html").read_text(encoding="utf-8")
          js = Path("django/static/js/tatami.js").read_text(encoding="utf-8")
          admin_css = Path("django/static/css/tatami-admin.css").read_text(encoding="utf-8")
          module_css = Path("django/static/css/module-pages.css").read_text(encoding="utf-8")
          manifest = json.loads(Path("deploy/frontend-manifest.json").read_text(encoding="utf-8"))

          assert 'class="site-nav" id="nv"' in base
          assert 'class="ib tp-gem-header gem-chip" id="hgem"' in base
          assert "new_coach_leads_count" in admin
          assert "admin:accounts_signuplead_changelist" in admin
          assert "data-video-upload-form" in episode
          assert "tp-otp-resend-until:" in js
          assert "request.upload.addEventListener('progress'" in js
          assert "uploadRequest.abort()" in js
          assert "X-CSRFToken" in js
          assert ".tp-video-upload-progress" in module_css
          assert ".tp-admin-lead-notice" in admin_css

          static_mapping = next(item for item in manifest["mappings"] if item["destination"] == "static")
          assert "css/tatami.css" in static_mapping.get("exclude", [])
          print("FRONTEND_PATCH_CONTRACT_OK")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the pinned backend contract revision
        run: |
          set -euo pipefail
          git clone https://github.com/Radinsharifi/Tatami-demo.git backend
          git -C backend checkout --detach e2ffeba0a42ecc3ec172b89d66794f9cd628d977

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install proposed frontend templates and static files into isolated backend checkout
        run: |
          set -euo pipefail
          mkdir -p backend/templates backend/static
          cp -a django/templates/. backend/templates/
          cp -a django/static/. backend/static/

      - name: Validate Django settings
        working-directory: backend
        run: python manage.py check

      - name: Compile templates and resolve required static assets
        working-directory: backend
        run: |
          python manage.py shell -c "from django.template.loader import get_template; from django.contrib.staticfiles.finders import find; names=('base.html','admin/base_site.html','pages/home.html','pages/account.html','store/product_list.html','store/product_detail.html','store/cart_detail.html','coaches/directory.html','coaches/profile_detail.html','club/course_list.html','club/course_detail.html','club/coach/episode_form.html','gems/history.html','accounts/login.html','includes/form_fields.html'); [get_template(name) for name in names]; assets=('css/tatami-admin.css','css/backend-templates.css','css/module-pages.css','js/tatami.js'); assert all(find(name) for name in assets); print('DJANGO_TEMPLATE_AND_STATIC_CHECK_OK')"

      - name: Run backend tests with proposed frontend
        working-directory: backend
        run: python manage.py test accounts.tests.CoachSignupLeadTests gems.tests.GemPageTests --verbosity 1

      - name: Build manifest-approved Django frontend package
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          manifest_path = Path("deploy/frontend-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          handoff = Path("handoff")
          if handoff.exists():
              shutil.rmtree(handoff)
          handoff.mkdir(parents=True)

          selected = []
          for mapping in manifest["mappings"]:
              source_root = Path(mapping["source"])
              destination_root = Path(mapping["destination"])
              extensions = {suffix.lower() for suffix in mapping["extensions"]}
              excludes = mapping.get("exclude", [])

              for source in sorted(source_root.rglob("*")):
                  if not source.is_file():
                      continue
                  if source.is_symlink():
                      raise SystemExit(f"Refusing symlink: {source}")
                  relative = source.relative_to(source_root).as_posix()
                  if any(relative == item or relative.startswith(item.rstrip("/") + "/") for item in excludes):
                      continue
                  if source.suffix.lower() not in extensions:
                      continue

                  destination = destination_root / relative
                  target = handoff / destination
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  data = target.read_bytes()
                  selected.append({
                      "path": destination.as_posix(),
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })

          if not selected:
              raise SystemExit("Manifest selected zero files")
          selected.sort(key=lambda item: item["path"])
          metadata = {
              "schema_version": 1,
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "source_commit": os.environ.get("GITHUB_SHA"),
              "file_count": len(selected),
              "files": selected,
          }
          (handoff / "DEPLOYMENT.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8",
          )
          (handoff / "deploy").mkdir()
          shutil.copy2(manifest_path, handoff / "deploy/frontend-manifest.json")

          archive = Path("tatami-django-frontend-handoff.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as bundle:
              for item in sorted(handoff.rglob("*")):
                  if item.is_file():
                      bundle.write(item, item.relative_to(handoff).as_posix())
          with zipfile.ZipFile(archive) as bundle:
              bad = bundle.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failure: {bad}")
          print(f"DJANGO_FRONTEND_PACKAGE_OK | files={len(selected)} | commit={os.environ.get('GITHUB_SHA')}")
          PY

      - name: Upload verified Django frontend handoff
        uses: actions/upload-artifact@v4
        with:
          name: tatami-django-frontend-handoff
          path: tatami-django-frontend-handoff.zip
          if-no-files-found: error
          retention-days: 14
