name: Build manual cPanel Preview package

on:
  push:
    branches:
      - "feat/preview-course-catalog"
    paths:
      - "shared/src/**"
      - "shared/public/assets/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/build-preview-package.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shared/src/**"
      - "shared/build.js"
      - "shared/package.json"
      - ".github/workflows/build-preview-package.yml"

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Preview
        working-directory: shared
        run: node build.js

      - name: Validate generated Preview and JavaScript syntax
        working-directory: shared
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/preview/index.html
          test -d dist/preview/assets
          test -s dist/preview/assets/images/manifest.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const html = fs.readFileSync("dist/preview/index.html", "utf8");
          const required = [
            '<main id="app"></main>',
            "دوره‌های آموزشی",
            "پخش ویدئو در پیش‌نمایش فعال نیست",
            "ثبت‌نام در دوره",
            "جم‌های من",
            "تاریخچه تراکنش‌ها",
            "موجودی واقعی هنوز به این نسخه متصل نشده است.",
            "جستجوی باشگاه‌ها",
            "نزدیک من",
            "نقشهٔ نشان",
            "اطلاعات فعلی: نمونه"
          ];
          for (const item of required) {
            if (!html.includes(item)) throw new Error("Missing Preview content: " + item);
          }
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error("No inline application script was generated");
          fs.writeFileSync("/tmp/tatami-preview-inline.js", scripts.map(x => x[1]).join("\n"));
          JSON.parse(fs.readFileSync("dist/preview/assets/images/manifest.json", "utf8"));
          NODE
          node --check /tmp/tatami-preview-inline.js
          node --check public/assets/neshan-config.js
          test -s dist/preview/assets/neshan-config.js

      - name: Create cPanel upload ZIP
        working-directory: shared
        run: |
          set -euo pipefail
          cd dist/preview
          zip -qr "$GITHUB_WORKSPACE/tatami-preview-cpanel.zip" .

      - name: Upload manual cPanel package
        uses: actions/upload-artifact@v4
        with:
          name: tatami-preview-cpanel
          path: tatami-preview-cpanel.zip
          if-no-files-found: error
          retention-days: 7
