name: Django frontend checks and cPanel handoff

'on':
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "shared/build.js"
      - "shared/src/css/**"
      - "shared/src/js/shared/django-route-bridge.js"
      - "shared/src/data/store-products.json"
      - "shared/src/design/tokens.json"
      - "deploy/frontend-manifest.json"
      - ".github/workflows/django-frontend-contract.yml"
  pull_request:
    branches:
      - main
    paths:
      - "django/templates/**"
      - "django/static/**"
      - "shared/build.js"
      - "shared/src/css/**"
      - "shared/src/js/shared/django-route-bridge.js"
      - "shared/src/data/store-products.json"
      - "shared/src/design/tokens.json"
      - "deploy/frontend-manifest.json"
      - ".github/workflows/django-frontend-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate Django frontend and build cPanel handoff
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: |
          set -euo pipefail
          node --check django/static/js/tatami.js
          node --check django/static/js/module-pages.js
          node --check django/static/js/home-restored.js
          node --check django/static/js/reference-store.js
          node --check shared/src/js/shared/django-route-bridge.js

      - name: Verify shared design system output
        run: |
          set -euo pipefail
          node shared/build.js
          git diff --exit-code -- django/static/css/tatami.css

      - name: Check frontend patch contracts
