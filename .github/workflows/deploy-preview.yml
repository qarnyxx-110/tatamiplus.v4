name: Build and deploy Tatami Plus preview to cPanel

on:
  push:
    branches:
      - main
    paths:
      - "shared/src/**"
      - "shared/public/assets/**"
      - "shared/build.js"
      - "shared/package.json"
      - "shared/tests/**"
      - "django/static/js/**"
      - ".github/workflows/deploy-preview.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shared/src/**"
      - "shared/public/assets/**"
      - "shared/build.js"
      - "shared/package.json"
      - "shared/tests/**"
      - "django/static/js/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:
    inputs:
      deploy_to_cpanel:
        description: "Publish to cPanel (normally upload the generated package manually)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and validate preview
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser-test dependencies
        working-directory: shared
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Student PWA browser regression suite
        working-directory: shared
        env:
          ONLY: student
        run: npm test

      - name: Run Coach PWA browser regression suite
        working-directory: shared
        env:
          ONLY: coach
        run: npm test

      - name: Run Club PWA browser regression suite
        working-directory: shared
        env:
          ONLY: club
        run: npm test

      - name: Run global card alignment regression tests
        working-directory: shared
        run: node tests/card-layout.test.mjs

      - name: Run Django browser runtime regression tests
        working-directory: shared
        run: node tests/django-ui.test.mjs

      - name: Run focused clubs and map browser tests
        working-directory: shared
        env:
          ONLY: clubs
        run: npm test

      - name: Run focused Preview access, account, and store browser tests
        working-directory: shared
        env:
          ONLY: preview
        run: npm test

      - name: Remove stale Preview output
        working-directory: shared
        run: rm -rf dist/preview

      - name: Build static preview
        working-directory: shared
        run: npm run build

      - name: Validate generated preview
        working-directory: shared
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/preview/index.html
          test -d dist/preview/assets
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const html = fs.readFileSync("dist/preview/index.html", "utf8");
          if (!html.includes('<main id="app"></main>')) {
            throw new Error("Preview app mount point is missing.");
          }
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (scripts.length === 0) {
            throw new Error("No inline application script was generated.");
          }
          fs.writeFileSync("/tmp/tatami-preview-inline.js", scripts.map(match => match[1]).join("\n"));
          JSON.parse(fs.readFileSync("dist/preview/assets/images/manifest.json", "utf8"));
          if (!fs.existsSync("dist/preview/assets/neshan-config.js")) {
            throw new Error("Preview Neshan config asset is missing.");
          }
          for (const app of ["student", "coach", "club"]) {
            const root = "dist/" + app;
            const configPath = root + "/assets/neshan-config.js";
            if (!fs.existsSync(configPath)) throw new Error(app + ": Neshan config asset is missing.");
            const appHtml = fs.readFileSync(root + "/index.html", "utf8");
            if (!appHtml.includes('src="assets/neshan-config.js"')) {
              throw new Error(app + ": Neshan config script reference is missing.");
            }
            const sw = fs.readFileSync(root + "/sw.js", "utf8");
            if (!sw.includes('"assets/neshan-config.js"')) {
              throw new Error(app + ": Neshan config is not in the Service Worker precache list.");
            }
            const config = fs.readFileSync(configPath, "utf8");
            if (!config.includes("TP_NESHAN_WEB_KEY") || !config.includes("TP_CLUBS_JSON_URL")) {
              throw new Error(app + ": Neshan config does not expose the expected public settings.");
            }
            fs.writeFileSync("/tmp/tatami-" + app + "-neshan-config.js", config);
          }
          NODE
          node --check /tmp/tatami-preview-inline.js
          node --check /tmp/tatami-student-neshan-config.js
          node --check /tmp/tatami-coach-neshan-config.js
          node --check /tmp/tatami-club-neshan-config.js

      - name: Upload built Preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: tatami-preview
          path: shared/dist/preview/
          if-no-files-found: error
          retention-days: 3

      - name: Package Student, Coach, and Club PWA builds
        working-directory: shared/dist
        run: zip -qr "$GITHUB_WORKSPACE/tatami-pwa-neshan-config.zip" student coach club

      - name: Upload corrected PWA package
        uses: actions/upload-artifact@v4
        with:
          name: tatami-pwa-neshan-config
          path: tatami-pwa-neshan-config.zip
          if-no-files-found: error
          retention-days: 7

      - name: Package exact changed frontend source files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BASE_REF="${BASE_SHA:-origin/${DEFAULT_BRANCH}}"
          git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null
          git diff --name-only "${BASE_REF}"...HEAD > /tmp/tatami-changed-files.txt
          mkdir -p source-handoff
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            mkdir -p "source-handoff/$(dirname "$file")"
            cp "$file" "source-handoff/$file"
          done < /tmp/tatami-changed-files.txt
          test -n "$(find source-handoff -type f -print -quit)"
          (cd source-handoff && zip -qr "$GITHUB_WORKSPACE/tatami-nine-phase-source-files.zip" .)

      - name: Upload exact changed source files
        uses: actions/upload-artifact@v4
        with:
          name: tatami-nine-phase-source-files
          path: tatami-nine-phase-source-files.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish Preview to cPanel
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_cpanel == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check whether cPanel credentials are configured
        id: ftp_credentials
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [[ -n "$FTP_SERVER" && -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "cPanel deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build passed, but cPanel upload was skipped. Configure FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD repository secrets."
          fi

      - name: Download built Preview artifact
        if: ${{ steps.ftp_credentials.outputs.configured == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: tatami-preview
          path: ./release

      - name: Deploy Preview to the restricted cPanel FTP directory
        if: ${{ steps.ftp_credentials.outputs.configured == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: ./release/
          server-dir: ./
          dangerous-clean-slate: false
          security: strict
          timeout: 60000
