<script>const TP_CMS={"apiBase":"","mode":"demo"},BL_SEED=[{"id":1,"slug":"ukemi-first-lesson","title":"اوکمی: چرا زمین‌خوردن را اول یاد می‌گیریم","excerpt":"تکنیک‌های افتادن ایمن پایه تمام تمرین‌های پرتاب هستند.","body_html":"<p>اوکمی مجموعه روش‌های افتادن کنترل‌شده است. هنرجو یاد می‌گیرد ضربه را با دست و بدنه پخش کند و سرش را از زمین دور نگه دارد.</p><p>معمولاً پیش از تمرین پرتاب، افتادن به عقب، پهلو و جلو روی تشک آموزش داده می‌شود و مربی اجرای درست را زیر نظر می‌گیرد.</p>","category":"آموزش","author_name":"امیر صالحی","tags":[],"cover_image_url":"","seo_title":"","seo_description":"","status":"published","published_at":"2026-09-28T00:00:00.000Z","updated_at":"2026-09-28T00:00:00.000Z"},{"id":2,"slug":"kumi-kata-grip-fight","title":"کومی‌کاتا: نبرد گرفتن یقه و آستین","excerpt":"پیش از هر پرتاب، گرفتن مناسب تعیین می‌کند چه کسی ابتکار را در دست دارد.","body_html":"<p>کومی‌کاتا یعنی روش گرفتن لباس حریف. گرفتن یقه با یک دست و آستین با دست دیگر رایج‌ترین حالت است و جهت‌دهی به حرکت حریف را ممکن می‌کند.</p><p>تمرین‌های گرفتن و رها کردن گریپ در رندوری، کنترل مچ و آرنج را بهتر می‌کند و ورود به فن‌ها را روان‌تر می‌سازد.</p>","category":"آموزش","author_name":"رضا کیانی","tags":[],"cover_image_url":"","seo_title":"","seo_description":"","status":"published","published_at":"2026-09-25T00:00:00.000Z","updated_at":"2026-09-25T00:00:00.000Z"},{"id":3,"slug":"uchi-mata-basics","title":"اوچی‌ماتا: ورود، بالا بردن پا و چرخش لگن","excerpt":"مروری بر مراحل ورود و کنترل در پرتاب ران داخلی.","body_html":"<p>اوچی‌ماتا پرتابی است که با زدن ران داخلی حریف و کنترل بالاتنه اجرا می‌شود. تعادل روی پای محور و چرخش لگن نقش اصلی را دارند.</p><p>برای شروع، ورود بدون پرتاب (اوچی‌کومی) را با شریک تمرین کنید و به ترتیب حرکت پا، لگن و بالاتنه دقت کنید.</p>","category":"آموزش","author_name":"سارا احمدی","tags":[],"cover_image_url":"","seo_title":"","seo_description":"","status":"published","published_at":"2026-09-22T00:00:00.000Z","updated_at":"2026-09-22T00:00:00.000Z"},{"id":4,"slug":"belt-order","title":"ترتیب کمربندها در جودو","excerpt":"مروری ساده بر مسیر معمول کمربندها از سفید تا مشکی.","body_html":"<p>در بسیاری از باشگاه‌ها ترتیب کمربندها سفید، زرد، نارنجی، سبز، آبی، قهوه‌ای و مشکی است. این ترتیب بسته به فدراسیون و رده سنی ممکن است متفاوت باشد.</p><p>ارتقای کمربند معمولاً بر اساس مهارت، سابقه تمرین و نظر مربی یا آزمون انجام می‌شود.</p>","category":"آموزش","author_name":"امیر صالحی","tags":[],"cover_image_url":"","seo_title":"","seo_description":"","status":"published","published_at":"2026-09-19T00:00:00.000Z","updated_at":"2026-09-19T00:00:00.000Z"},{"id":5,"slug":"safe-weight-cut","title":"کاهش وزن ایمن پیش از مسابقه","excerpt":"چرا کم‌آبی شدید برای ورزشکار خطرناک است و چه جایگزین‌هایی وجود دارد.","body_html":"<p>در ورزش‌های وزنی مثل جودو، برخی ورزشکاران پیش از وزن‌کشی تلاش می‌کنند وزن کم کنند. کم‌آبی شدید و گرسنگی می‌تواند عملکرد و سلامت را به خطر بیندازد.</p><p>برنامه تدریجی و مشورت با متخصص تغذیه ورزشی امن‌تر است. این مطلب آموزشی عمومی است و جایگزین توصیه پزشک نیست.</p>","category":"تغذیه و آمادگی","author_name":"نگار فرهادی","tags":[],"cover_image_url":"","seo_title":"","seo_description":"","status":"published","published_at":"2026-09-16T00:00:00.000Z","updated_at":"2026-09-16T00:00:00.000Z"},{"id":6,"slug":"ippon-wazaari-shido","title":"ایپون، واظاری و شیدو: امتیازها را بشناسید","excerpt":"آشنایی با مفهوم امتیازها و خطاها در مسابقه جودو.","body_html":"<p>ایپون امتیاز کامل است و در صورت ثبت، مسابقه تمام می‌شود. واظاری امتیاز جزئی است و شیدو اخطار برای رفتار یا اجرای خلاف قوانین است.</p><p>جزئیات امتیازدهی با به‌روزرسانی قوانین فدراسیون جهانی تغییر می‌کند؛ پیش از مسابقه آخرین مقررات برگزارکننده را بخوانید.</p>","category":"قوانین و داوری","author_name":"حسین رادمنش","tags":[],"cover_image_url":"","seo_title":"","seo_description":"","status":"published","published_at":"2026-09-13T00:00:00.000Z","updated_at":"2026-09-13T00:00:00.000Z"},{"id":7,"slug":"first-competition","title":"برای اولین مسابقه چطور آماده شویم؟","excerpt":"چک‌لیستی ساده برای هفته‌های پیش از اولین تورنمنت.","body_html":"<p>کنترل وزن در محدوده امن، تمرین رندوری با شریک‌های مختلف و مرور قوانین از کارهای اصلی هفته‌های پایانی است.</p><p>روز مسابقه زودتر برسید، لباس و کمربند استاندارد همراه داشته باشید و با مربی درباره برنامه گرم کردن هماهنگ کنید.</p>","category":"مسابقه","author_name":"مریم نوری","tags":[],"cover_image_url":"","seo_title":"","seo_description":"","status":"published","published_at":"2026-09-10T00:00:00.000Z","updated_at":"2026-09-10T00:00:00.000Z"},{"id":8,"slug":"judogi-care","title":"نگهداری از لباس جودو","excerpt":"چند نکته ساده برای شستشو و طول عمر بیشتر لباس.","body_html":"<p>لباس را با آب سرد یا ولرم بشویید و از آب بسیار داغ و خشک‌کن پرحرارت بپرهیزید تا آب نرود و پارچه نفرسایید.</p><p>لباس خیس را درون کیف نگه ندارید؛ بعد از تمرین آن را آویزان کنید تا خشک شود و بوی بد نگیرد.</p>","category":"تجهیزات","author_name":"نگار فرهادی","tags":[],"cover_image_url":"","seo_title":"","seo_description":"","status":"published","published_at":"2026-09-07T00:00:00.000Z","updated_at":"2026-09-07T00:00:00.000Z"}],TPD_SEED={"categories":[{"slug":"nage-waza","name":"فنون پرتابی","nameJa":"投げ技","romaji":"Nage-waza","order":1},{"slug":"katame-waza","name":"فنون خاک","nameJa":"固技","romaji":"Katame-waza","order":2},{"slug":"osaekomi-waza","name":"فن‌های مهار و نگه‌داشتن","nameJa":"抑込技","romaji":"Osaekomi-waza","order":3},{"slug":"shime-waza","name":"فن‌های خفه‌کردن","nameJa":"絞技","romaji":"Shime-waza","order":4},{"slug":"kansetsu-waza","name":"فن‌های قفل مفصل","nameJa":"関節技","romaji":"Kansetsu-waza","order":5},{"slug":"refereeing","name":"اصطلاحات داوری و مسابقه","nameJa":"","romaji":"","order":6},{"slug":"commands","name":"فرمان‌ها و واژگان ژاپنی روی تاتامی","nameJa":"","romaji":"","order":7},{"slug":"principles","name":"اصول و مفاهیم پایه جودو","nameJa":"","romaji":"","order":8},{"slug":"ranks","name":"درجه‌ها و کمربندها","nameJa":"","romaji":"","order":9},{"slug":"etiquette","name":"آداب و رسوم جودو","nameJa":"","romaji":"","order":10}],"terms":[{"slug":"judo","nameFa":"جودو","nameJa":"柔道","romaji":"Jūdō","meaning":"«راه نرمش» یا «راه انعطاف»","description":"واژه از دو بخش ساخته شده است: «جو» (柔) به معنی نرمی و انعطاف و «دو» (道) به معنی راه. جودو را جیگورو کانو در ژاپن پایه‌گذاری کرد و مدرسه او، کودوکان، در سال ۱۸۸۲ آغاز به کار کرد.","usage":"نام ورزش و هنر رزمی؛ در نام باشگاه‌ها، مسابقات و فدراسیون‌ها.","categories":["principles"],"related":["kodokan","dojo","seiryoku-zenyo"],"featured":true,"status":"published"},{"slug":"kodokan","nameFa":"کودوکان","nameJa":"講道館","romaji":"Kōdōkan","meaning":"«سالنِ آموختن راه»","description":"نام مدرسه‌ای که جیگورو کانو در سال ۱۸۸۲ در توکیو برای آموزش جودو تأسیس کرد. بسیاری از نام‌گذاری‌ها و دسته‌بندی فنون جودو بر پایه سنت کودوکان است.","usage":"در اشاره به مرجع تاریخی جودو و نام‌گذاری فنون.","categories":["principles"],"related":["judo","dojo"],"featured":false,"status":"published"},{"slug":"dojo","nameFa":"دوجو","nameJa":"道場","romaji":"Dōjō","meaning":"«محل تمرین راه»","description":"محلی که در آن جودو (و سایر هنرهای رزمی) آموزش داده و تمرین می‌شود. «دو» (道) به معنی راه و «جو» (場) به معنی مکان است.","usage":"هنگام ورود و خروج از سالن تمرین معمولاً با آداب خاص (مثل تعظیم) رفتار می‌شود.","categories":["etiquette","commands"],"related":["rei","tatami","sensei"],"featured":false,"status":"published"},{"slug":"tatami","nameFa":"تاتامی","nameJa":"畳","romaji":"Tatami","meaning":"تشک یا کف‌پوش تمرین و مسابقه","description":"واژه در اصل به حصیرهای بافته‌شده کف خانه‌های سنتی ژاپن اشاره دارد. در جودو به سطح تشک‌پوشیده‌ای گفته می‌شود که تمرین و مسابقه روی آن انجام می‌شود.","usage":"«روی تاتامی رفتن» یعنی ورود به محل تمرین/مسابقه؛ معمولاً با پای برهنه و رعایت آداب.","categories":["commands","etiquette"],"related":["dojo","rei"],"featured":false,"status":"published"},{"slug":"judogi","nameFa":"جودوگی","nameJa":"柔道着","romaji":"Jūdōgi","meaning":"لباس جودو","description":"لباس رسمی تمرین و مسابقه جودو. شامل کت (اوواگی)، شلوار (زوبون) و کمربند (اوبی) است.","usage":"پوشیدن لباس تمیز و مرتب بخشی از آداب تمرین است.","categories":["etiquette","ranks"],"related":["obi","rei"],"featured":false,"status":"published"},{"slug":"obi","nameFa":"اوبی (کمربند)","nameJa":"帯","romaji":"Obi","meaning":"کمربند","description":"کمربندی که کت جودوگی را می‌بندد و رنگ آن نشان‌دهنده درجه جودوکار است.","usage":"در گفت‌وگو درباره درجه: «کمربند مشکی»، «کمربند سبز» و غیره.","categories":["ranks"],"related":["kyu","dan","judogi"],"featured":false,"status":"published"},{"slug":"rei","nameFa":"ری (احترام)","nameJa":"礼","romaji":"Rei","meaning":"احترام؛ تعظیم","description":"تعظیم نشانه احترام به شریک تمرین، مربی و محل تمرین است. در جودو، آداب احترام بخش مهمی از آموزش است.","usage":"پیش و پس از تمرین، مسابقه یا تمرین با شریک.","categories":["etiquette","commands"],"related":["dojo","sensei","tatami"],"featured":true,"status":"published"},{"slug":"sensei","nameFa":"سنسی","nameJa":"先生","romaji":"Sensei","meaning":"معلم؛ استاد؛ مربی","description":"عنوان احترام‌آمیز برای معلم یا مربی. در بسیاری از باشگاه‌های جودو برای خطاب به مربی استفاده می‌شود.","usage":"«سنسی» پیش از نام یا به‌تنهایی در خطاب به مربی.","categories":["etiquette","commands"],"related":["dojo","rei"],"featured":false,"status":"published"},{"slug":"hajime","nameFa":"هاجیمه (شروع)","nameJa":"始め","romaji":"Hajime","meaning":"«شروع!»","description":"فرمان داور برای آغاز یا از سرگیری مسابقه.","usage":"در ابتدای مسابقه و پس از هر «ماته» که مسابقه ادامه می‌یابد.","categories":["refereeing","commands"],"related":["matte","sore-made"],"featured":true,"status":"published"},{"slug":"matte","nameFa":"ماته (توقف)","nameJa":"待て","romaji":"Matte","meaning":"«صبر کن»؛ «توقف!»","description":"فرمان داور برای توقف موقت مسابقه. پس از آن ورزشکاران به موقعیت مناسب بازمی‌گردند و داور مسابقه را با «هاجیمه» ادامه می‌دهد.","usage":"هر وقت داور مسابقه را موقتاً متوقف می‌کند.","categories":["refereeing","commands"],"related":["hajime","sore-made"],"featured":true,"status":"published"},{"slug":"sore-made","nameFa":"سوره‌مادِه (پایان)","nameJa":"それまで","romaji":"Sore-made","meaning":"«همین بود» ؛ «پایان!»","description":"فرمان داور برای پایان مسابقه (مثلاً پس از ایپون یا پایان زمان).","usage":"انتهای مسابقه.","categories":["refereeing","commands"],"related":["hajime","matte","ippon"],"featured":false,"status":"published"},{"slug":"ippon","nameFa":"ایپون","nameJa":"一本","romaji":"Ippon","meaning":"«یک امتیاز کامل»","description":"بالاترین امتیاز در جودو؛ ثبت آن مسابقه را تمام می‌کند. در قوانین داوری IJF دوره ۲۰۱۸–۲۰۲۰ (که برای این متن بررسی شد) نگه‌داشتن حریف در مهار به مدت ۲۰ ثانیه هم ایپون است. قوانین ممکن است به‌روزرسانی شده باشند؛ برای مسابقه رسمی به آخرین مقررات فدراسیون مراجعه کنید.","usage":"اعلام داور هنگام امتیاز کامل.","categories":["refereeing"],"related":["waza-ari","osaekomi","sore-made"],"featured":true,"status":"published"},{"slug":"waza-ari","nameFa":"وازاری","nameJa":"技あり","romaji":"Waza-ari","meaning":"امتیاز جزئی (نزدیک به ایپون)","description":"امتیازی که وقتی معیارهای ایپون کامل نباشد داده می‌شود. دو وازاری برابر یک ایپون است (وازاری-آواسته-ایپون). در مهار، طبق قوانین IJF دوره ۲۰۱۸–۲۰۲۰، ۱۰ ثانیه نگه‌داشتن وازاری است؛ قوانین ممکن است تغییر کرده باشند.","usage":"اعلام داور هنگام امتیاز جزئی.","categories":["refereeing"],"related":["ippon","osaekomi"],"featured":true,"status":"published"},{"slug":"osaekomi","nameFa":"اوسه‌کومی","nameJa":"抑え込み","romaji":"Osaekomi","meaning":"مهار؛ نگه‌داشتن روی زمین","description":"هم نام گروه فنون مهار است و هم فرمانی که داور هنگام برقراری یک مهار معتبر اعلام می‌کند. وقتی حریف مهار را بشکند یا از آن رها شود، داور «توکِتا» اعلام می‌کند.","usage":"در مبارزه روی زمین (نه‌وازه).","categories":["osaekomi-waza","refereeing","commands"],"related":["toketa","kesa-gatame","ippon","waza-ari"],"featured":true,"status":"published"},{"slug":"toketa","nameFa":"توکِتا","nameJa":"解けた","romaji":"Toketa","meaning":"«باز شد»؛ مهار شکسته شد","description":"فرمان داور وقتی مهار شکسته یا رها شده است؛ ساعت مهار متوقف می‌شود.","usage":"پس از «اوسه‌کومی» هنگام رهایی.","categories":["  return shell('tatamipedia',`${crumb([['پنل','#/'],['تاتامی‌پدیا','#/tatamipedia'],[title]])}<div class="mk-head"><h1>${title}</h1></div>${errs&&errs._?`<div class="warn" role="alert">${esc([].concat(errs._).join(' '))}</div>`:''}
<div class="mk-form"><div class="mk-card">${fld('name_fa','نام فارسی',t.name_fa,{},errs)}${fld('name_ja','نام ژاپنی (با نوشتار صحیح)',t.name_ja,{dir:'ltr'},errs)}${fld('romaji','آوانویسی لاتین',t.romaji,{dir:'ltr'},errs)}${fld('slug','نشانی کوتاه (slug لاتین)',t.slug,{dir:'ltr',hint:'فقط حروف کوچک لاتین، عدد و خط‌تیره؛ یکتا.'},errs)}${fld('meaning','معنی فارسی',t.meaning,{},errs)}${fld('description','توضیحات',t.description,{area:1,rows:5},errs)}${fld('usage','کاربرد',t.usage,{area:1,rows:2},errs)}${fld('safety','نکته ایمنی (اختیاری)',t.safety,{area:1,rows:2},errs)}</div>
<div class="mk-side"><div class="mk-card"><h2 style="font-size:var(--tp-font-size-lg)">انتشار</h2><div class="tp-field"><label for="f-status">وضعیت</label><select id="f-status"><option value="draft" ${t.status==='draft'?'selected':''}>پیش‌نویس</option><option value="published" ${t.status==='published'?'selected':''}>منتشرشده</option></select></div><label class="tp-cluster"><input type="checkbox" id="f-featured" ${t.featured?'checked':''} style="min-height:auto;width:1.1rem;height:1.1rem"> اصطلاح پرکاربرد</label><div class="tp-cluster" style="margin-top:var(--tp-space-sm)"><button type="button" class="btn" onclick="saveTerm()">ذخیره</button>${id!=='new'&&can('glossary.delete')?'<button type="button" class="btn o dg" onclick="deleteTerm()">حذف</button>':''}</div></div>
<div class="mk-card"><span class="tp-label" id="tcl">دسته‌بندی‌ها</span><div class="mk-checks" role="group" aria-labelledby="tcl">${cats.map(c=>`<label><input type="checkbox" name="tcat" value="${esc(c.slug)}" ${t.categories.includes(c.slug)?'checked':''}>${esc(c.name)}</label>`).join('')}</div>${fe(errs,'categories')}</div>
<div class="mk-card"><span class="tp-label" id="trl">اصطلاحات مرتبط</span><div class="mk-checks" role="group" aria-labelledby="trl">${all.results.filter(x=>x.slug!==t.slug).map(x=>`<label><input type="checkbox" name="trel" value="${esc(x.slug)}" ${t.related.includes(x.slug)?'checked':''}>${esc(x.name_fa)}</label>`).join('')}</div></div>
<div class="mk-card"><span class="tp-label">تصویر (اختیاری)</span><div id="tcover">${coverBox2(t.image_url)}</div><div class="tp-field"><label for="f-timg">انتخاب تصویر مجاز (حداکثر ۲ مگابایت)</label><input id="f-timg" type="file" accept="${MEDIA_TYPES.join(',')}" onchange="pickTermImg(this)"></div></div></div></div>`)}
const coverBox2=u=>u?`<img class="mk-cover" src="${esc(u)}" alt="تصویر اصطلاح"><button type="button" class="btn s o" onclick="TE.cover='';$('#tcover').innerHTML=coverBox2('')">حذف تصویر</button>`:'<p class="mu sm">تصویری انتخاب نشده است. فقط تصویر دارای مجوز استفاده کنید.</p>';
async function pickTermImg(inp){const f=inp.files[0],err=mediaCheck(f);if(err){toast(err,'error');inp.value='';return}try{const r=await DB.uploadMedia(f);TE.cover=r.url;$('#tcover').innerHTML=coverBox2(r.url);toast('تصویر بارگذاری شد')}catch(e){toast(errText(e),'error')}}
const checked=n=>[...document.querySelectorAll('input[name="'+n+'"]:checked')].map(x=>x.value);
function collectTerm(){return{id:TE.id,slug:val('slug').trim(),name_fa:val('name_fa').trim(),name_ja:val('name_ja').trim(),romaji:val('romaji').trim(),meaning:val('meaning').trim(),description:val('description').trim(),usage:val('usage').trim(),safety:val('safety').trim(),categories:checked('tcat'),related:checked('trel'),featured:$('#f-featured').checked,status:val('status'),image_url:TE.cover}}
async function saveTerm(){const d=collectTerm(),e={};if(!d.name_fa)e.name_fa='نام فارسی الزامی است.';if(!d.romaji)e.romaji='آوانویسی الزامی است.';if(!d.meaning)e.meaning='معنی الزامی است.';if(!d.slug)e.slug='نشانی کوتاه الزامی است.';else if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(d.slug))e.slug='فقط حروف کوچک لاتین، عدد و خط‌تیره.';if(d.status==='published'&&!d.categories.length)e.categories='برای انتشار حداقل یک دسته‌بندی انتخاب کنید.';
 if(Object.keys(e).length){$('#app').innerHTML=await termEditView(TE.id||'new',e,d);toast('لطفاً خطاهای فرم را اصلاح کنید.','error');return}
 try{const s=await DB.saveTerm(d);toast(d.status==='published'?'اصطلاح ذخیره و منتشر شد':'پیش‌نویس ذخیره شد');history.replaceState(null,'','#/tatamipedia/'+s.id);$('#app').innerHTML=await termEditView(s.id)}catch(er){$('#app').innerHTML=await termEditView(TE.id||'new',er.errors||{_:'ذخیره نشد.'},d);toast(errText(er),'error')}}
function deleteTerm(){const id=TE.id;tpModal({title:'حذف اصطلاح',body:'<p>این اصطلاح برای همیشه حذف می‌شود. ادامه می‌دهید؟</p>',actions:[['حذف اصطلاح'],['انصراف']],onAction:async i=>{if(i!==0)return;try{await DB.deleteTerm(id);toast('اصطلاح حذف شد');location.hash='#/tatamipedia'}catch(er){toast(errText(er),'error')}}})}
// ---- دسته‌های تاتامی‌پدیا
let CE=null;
async function termCatsView(){const cats=await DB.listTermCats();
 return shell('tatamipedia-categories',`<div class="mk-head"><h1>دسته‌های تاتامی‌پدیا</h1>${can('glossary.manage')?'<button type="button" class="btn" onclick="editTermCat(0)">دسته جدید</button>':''}</div>${cats.length?cats.map(c=>`<div class="mk-row"><div><b>${esc(c.name)}</b><div class="meta"><span class="tp-ltr">${esc(c.slug)}</span><span class="tp-ja" lang="ja" style="font-size:var(--tp-font-size-base)">${esc(c.name_ja)}</span><span>ترتیب ${F(c.order)}</span></div></div><div class="tp-cluster"><button type="button" class="btn s o" onclick="editTermCat(${c.id})" aria-label="ویرایش ${esc(c.name)}">ویرایش</button>${can('glossary.delete')?`<button type="button" class="btn s o dg" onclick="delTermCat(${c.id})" aria-label="حذف ${esc(c.name)}">حذف</button>`:''}</div></div>`).join(''):tpState('empty','دسته‌ای نیست','با «دسته جدید» شروع کنید.')}`)}
async function editTermCat(id){const cats=await DB.listTermCats(),c=cats.find(x=>x.id==id)||{id:null,slug:'',name:'',name_ja:'',romaji:'',order:cats.length+1};CE=c.id;
 tpModal({title:id?'ویرایش دسته':'دسته جدید',body:`<div class="tp-field"><label for="c-name">نام فارسی</label><input id="c-name" value="${esc(c.name)}"></div><div class="tp-field"><label for="c-slug">نشانی کوتاه (لاتین)</label><input id="c-slug" dir="ltr" value="${esc(c.slug)}"></div><div class="tp-field"><label for="c-ja">نام ژاپنی</label><input id="c-ja" dir="ltr" value="${esc(c.name_ja)}"></div><div class="tp-field"><label for="c-ro">آوانویسی</label><input id="c-ro" dir="ltr" value="${esc(c.romaji)}"></div><div class="tp-field"><label for="c-or">ترتیب نمایش</label><input id="c-or" inputmode="numeric" dir="ltr" value="${esc(c.order)}"></div><p class="tp-error-text" id="c-err" role="alert" hidden></p>`,actions:[['ذخیره'],['انصراف']],
  validate:()=>{const d={id:CE,name:$('#c-name').value.trim(),slug:$('#c-slug').value.trim(),name_ja:$('#c-ja').value.trim(),romaji:$('#c-ro').value.trim(),order:$('#c-or').value};const m=!d.name?'نام الزامی است.':!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(d.slug)?'نشانی کوتاه فقط حروف کوچک لاتین، عدد و خط‌تیره.':'';if(m){$('#c-err').textContent=m;$('#c-err').hidden=false;return false}window._cd=d;return true},
  onAction:async i=>{if(i!==0)return;try{await DB.saveTermCat(window._cd);toast('ذخیره شد');route()}catch(er){toast(errText(er),'error')}}})}
function delTermCat(id){tpModal({title:'حذف دسته',body:'<p>این دسته حذف می‌شود. ادامه می‌دهید؟</p>',actions:[['حذف'],['انصراف']],onAction:async i=>{if(i!==0)return;try{await DB.deleteTermCat(id);toast('حذف شد');route()}catch(er){toast(errText(er),'error')}}})}

// مسیریابی پنل (هش‌محور) + دروازه ورود. مسیرها: #/، #/articles، #/articles/new، #/articles/<id>، #/tatamipedia[/new|/<id>]، #/tatamipedia-categories
const NF=()=>`<div class="mk-login">${tpState('error','صفحه پیدا نشد','آدرس معتبر نیست.','بازگشت به خلاصه','#/')}</div>`;
async function currentView(){const h=location.hash.replace(/^#\/?/,'').split('?')[0].split('/').filter((x,i,a)=>!(x===''&&i===a.length-1&&a.length>1)),k=h[0]||'',id=h[1];
 const need=p=>can(p)?null:shell(k,tpState('error','دسترسی ندارید','حساب شما مجوز این بخش را ندارد (دسترسی واقعی در بک‌اند کنترل می‌شود).','بازگشت','#/'));
 if(h.length>2)return NF();
 if(k==='')return h.length>1?NF():dashView();
 if(k==='articles'){if(id===undefined)return can('articles.manage')?articlesView():need('articles.manage');if(id==='new'||/^\d+$/.test(id))return need('articles.manage')||articleEditView(id);return NF()}
 if(k==='tatamipedia'){if(id===undefined)return can('glossary.manage')?termsView():need('glossary.manage');if(id==='new'||/^\d+$/.test(id))return need('glossary.manage')||termEditView(id);return NF()}
 if(k==='tatamipedia-categories'&&id===undefined)return need('glossary.manage')||termCatsView();
 return NF()}
let routeSeq=0;async function route(){const my=++routeSeq;if(!ME){try{ME=await DB.me()}catch(e){$('#app').innerHTML=`<div class="mk-login">${tpState('error','اتصال به سرور ممکن نیست',errText(e),'تلاش دوباره','javascript:route()')}</div>`;return}}
 if(!ME){$('#app').innerHTML=loginView();return}
 let html;try{html=await currentView()}catch(e){html=`<div class="mk-main">${tpState('error','بارگذاری ممکن نشد',errText(e),'تلاش دوباره','javascript:route()')}</div>`}
 if(my!==routeSeq)return;$('#app').innerHTML=html;scrollTo(0,0);document.title='پنل مارکتینگ | تاتامی پلاس';if($('#rte'))rteInit();
 const sd=$('#f-seo_description'),st=$('#f-seo_title');if(sd){const u=()=>{const c=$('#c-sd');c.textContent=F(sd.value.length)+' / ۱۶۰ نویسه (توصیه‌شده)';c.classList.toggle('over',sd.value.length>160)},v=()=>{const c=$('#c-st');c.textContent=F(st.value.length)+' / ۶۰ نویسه (توصیه‌شده)';c.classList.toggle('over',st.value.length>60)};sd.addEventListener('input',u);st.addEventListener('input',v);u();v()}
 const ti=$('#f-title'),sl=$('#f-slug');if(ti&&sl&&!AE.slugTouched){ti.addEventListener('input',()=>{if(!AE.slugTouched)sl.value=slugify(ti.value)});sl.addEventListener('input',()=>{AE.slugTouched=true})}}
addEventListener('hashchange',route);route();
</script></body></html>
